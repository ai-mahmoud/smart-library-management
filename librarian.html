<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Login - Smart Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="login-container">
            <div class="login-card">
                <h2>Librarian Login</h2>
                <form onsubmit="handleLibrarianLogin(event)">
                    <div class="form-group">
                        <label>Admin Password</label>
                        <input type="password" id="librarian-password" placeholder="Enter admin password" required>
                    </div>
                    <div id="librarian-error" class="error-message" style="display: none;"></div>
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>
                <button type="button" class="btn btn-secondary btn-full" onclick="window.location.href='index.html'">Back to Home</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
