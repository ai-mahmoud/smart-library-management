<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Member Login</h2>
            <form onsubmit="handleMemberLogin(event)">
                <div class="form-group">
                    <label>Member ID</label>
                    <input type="text" id="member-id" placeholder="Enter your Member ID" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="member-password" placeholder="Enter your password" required>
                </div>
                <div id="member-error" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>
            <button type="button" class="btn btn-secondary btn-full" onclick="window.location.href='index.html'">Back to Home</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
